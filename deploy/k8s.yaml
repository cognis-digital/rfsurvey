apiVersion: apps/v1
kind: Deployment
metadata: { name: rfsurvey, labels: { app: rfsurvey } }
spec:
  replicas: 1
  selector: { matchLabels: { app: rfsurvey } }
  template:
    metadata: { labels: { app: rfsurvey } }
    spec:
      containers:
        - name: rfsurvey
          image: ghcr.io/cognis-digital/rfsurvey:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: rfsurvey }
spec:
  selector: { app: rfsurvey }
  ports: [{ port: 80, targetPort: 8000 }]
