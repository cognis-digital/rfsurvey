[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wavewatch"
version = "0.1.0"
description = "Offline RF signal reconnaissance and triage from capture files (defensive, lawful-by-design)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cognis Digital LLC" }]
keywords = [
    "rf", "sdr", "signal", "spectrum", "iq", "sigmf", "dsp",
    "reconnaissance", "triage", "cyclostationary", "defensive",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]
# Zero third-party runtime dependencies. Pure Python stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/cognis-digital/wavewatch"

[project.scripts]
wavewatch = "wavewatch.cli:main"

[tool.setuptools.packages.find]
include = ["wavewatch*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
